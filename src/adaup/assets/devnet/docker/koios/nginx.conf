# Koios serves /api/v1/<name>; PostgREST serves the same functions at /rpc/<name>.
# Koios puts HAProxy in front of PostgREST for this rewrite. Nothing else is
# needed here: query strings and request bodies pass through unchanged.
server {
    listen 80;
    server_name _;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/v1/ {
        rewrite ^/api/v1/(.*)$ /rpc/$1 break;
        proxy_pass http://postgrest:3000;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }
}
